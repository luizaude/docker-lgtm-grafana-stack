version: 2
updates:
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10

  - package-ecosystem: "pip"
    directory: "/demo-app-python"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      opentelemetry:
        patterns:
          - "opentelemetry-*"

  - package-ecosystem: "gomod"
    directory: "/demo-app-go"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      opentelemetry:
        patterns:
          - "go.opentelemetry.io/*"
