name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # Weekly run catches newly disclosed CVEs in pinned dependencies even when
  # nobody is pushing code.
  schedule:
    - cron: "0 6 * * 1"  # Mondays at 06:00 UTC

permissions:
  contents: read
  security-events: write   # required to upload SARIF to the Security tab

jobs:
  # ===========================================================================
  # Validate docker-compose.yml syntax and resolved configuration.
  # Cheapest job — runs first to fail fast on typos.
  # ===========================================================================
  compose-validate:
    name: docker compose config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: docker compose config --quiet

  # ===========================================================================
  # Lint Dockerfiles with hadolint.
  # ===========================================================================
  hadolint:
    name: Hadolint (Dockerfiles)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        dockerfile:
          - demo-app-python/Dockerfile
          - demo-app-go/Dockerfile
    steps:
      - uses: actions/checkout@v4
      - uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: ${{ matrix.dockerfile }}
          # Don't fail the build on style warnings; keep errors strict.
          failure-threshold: error

  # ===========================================================================
  # Lint GitHub Actions workflows themselves.
  #
  # NOTE: rhysd/actionlint is the Go CLI / Docker image, NOT a composite
  # action — `uses: rhysd/actionlint@v1` does not resolve and fails every run
  # at the "Set up job" stage. The project's own docs recommend the official
  # Docker image in CI, which exits non-zero only on real workflow errors.
  # ===========================================================================
  actionlint:
    name: actionlint (workflows)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run actionlint
        uses: docker://rhysd/actionlint:latest
        with:
          args: -color

  # ===========================================================================
  # Audit Python dependencies (pip-audit).
  #
  # pip-audit does NOT expose vulnerability severity in a structured/reliable
  # way, so this job is INFORMATIONAL only: it generates SARIF for the Security
  # tab and surfaces findings in the run log, but never breaks the build.
  # The CRITICAL-severity gate for Python packages lives in the `trivy-image`
  # job, which scans the actually-installed dependencies using Trivy's
  # severity database.
  # ===========================================================================
  python-deps:
    name: Python dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: demo-app-python/requirements.txt
      - name: Install pip-audit
        run: python -m pip install --upgrade pip pip-audit

      # Generate SARIF with all findings. continue-on-error keeps the job green;
      # the result is surfaced in the Security tab, not used as a gate.
      - name: Audit (report all severities, informational)
        continue-on-error: true
        run: |
          pip-audit \
            -r demo-app-python/requirements.txt \
            --format sarif \
            --output pip-audit.sarif || true
          # pip-audit exits non-zero when it finds vulnerabilities, which is
          # fine here. Only synthesize an empty SARIF if the file was never
          # written (e.g. pip-audit crashed before producing output) — do NOT
          # overwrite a real report that already contains findings.
          # Minimal valid SARIF. $schema is optional and intentionally omitted
          # so the line doesn't trip shellcheck SC2016 (single-quoted '$' would
          # otherwise be flagged as a non-expanding variable).
          if [ ! -f pip-audit.sarif ]; then
            echo '{"version":"2.1.0","runs":[]}' > pip-audit.sarif
          fi

      - name: Upload SARIF to Security tab
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: pip-audit.sarif
          category: pip-audit

      # Human-readable summary in the run log (informational, never fails).
      - name: Audit (log summary)
        continue-on-error: true
        run: pip-audit -r demo-app-python/requirements.txt || true

  # ===========================================================================
  # Audit Go dependencies (govulncheck).
  # ===========================================================================
  go-vulncheck:
    name: Go dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: demo-app-go/go.mod
          cache-dependency-path: demo-app-go/go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        # govulncheck is reachability-aware — it only flags vulnerabilities in
        # code paths actually called by your app, so a non-zero exit means a
        # real exploitable issue. We surface output in the run log.
        run: govulncheck ./...
        working-directory: demo-app-go
        continue-on-error: true   # don't break build; surface in logs

  # ===========================================================================
  # Trivy — filesystem scan (Dockerfiles, configs, secrets in source).
  #
  # NOTE: trivy-action suffered a supply-chain tag-hijacking incident in
  # March 2026. v0.36.0 is post-incident and protected by GitHub immutable
  # releases, so the tag is safe; for extra hardening pin to the release SHA
  # and let Dependabot bump it.
  # ===========================================================================
  trivy-fs:
    name: Trivy filesystem scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Informational scan — full report uploaded to Security tab.
      - name: Trivy fs (SARIF report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-fs.sarif
          ignore-unfixed: true
          severity: CRITICAL,HIGH,MEDIUM
      - name: Upload SARIF to Security tab
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-fs

      # Strict gate — only CRITICAL fails the build.
      - name: Trivy fs (fail on CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: table
          ignore-unfixed: true
          severity: CRITICAL
          exit-code: "1"

  # ===========================================================================
  # Trivy — image scan for both demo apps (built locally).
  # Catches vulnerabilities in base images and OS-level packages, and is the
  # CRITICAL-severity gate for installed Python/Go dependencies.
  # ===========================================================================
  trivy-image:
    name: Trivy image scan
    runs-on: ubuntu-latest
    needs: compose-validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - app: demo-app-python
            tag: lgtm-stack/demo-app-python:ci
          - app: demo-app-go
            tag: lgtm-stack/demo-app-go:ci
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.app }}
          tags: ${{ matrix.tag }}
          load: true   # load into local Docker for scanning
          push: false

      # Informational scan — full report to Security tab.
      - name: Trivy image (SARIF report)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.tag }}
          format: sarif
          output: trivy-image-${{ matrix.app }}.sarif
          ignore-unfixed: true
          severity: CRITICAL,HIGH,MEDIUM
      - name: Upload SARIF to Security tab
        if: always()
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-image-${{ matrix.app }}.sarif
          category: trivy-image-${{ matrix.app }}

      # Strict gate — only CRITICAL fails the build.
      - name: Trivy image (fail on CRITICAL)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ matrix.tag }}
          format: table
          ignore-unfixed: true
          severity: CRITICAL
          exit-code: "1"